name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall app

      - name: Import smoke test
        run: python -c "from app.main import app; print(app.title)"

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      DEPLOY_BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }}
    steps:
      - name: Deploy to Tencent Cloud CVM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_BASE_PATH
          script: |
            set -euo pipefail
            BASE="${DEPLOY_BASE_PATH:-$HOME/ai-cs}"
            cd "$BASE/ai-cs-ai-service"
            git pull --ff-only
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart ai-cs-ai-service
            sudo systemctl is-active ai-cs-ai-service
